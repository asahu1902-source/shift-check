<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Shift Schedule & Holidays</title>

  <!-- Matches your exact uploaded file name: Calender.png -->
  <link rel="icon" type="image/png" href="Calender.png">
  <link rel="shortcut icon" href="Calender.png">
  <link rel="apple-touch-icon" href="Calender.png">
  <link rel="apple-touch-icon-precomposed" href="Calender.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow-x: auto;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }
    .schedule-container {
      width: 100%;
      max-width: 900px;
      height: 100%;
      flex: 1;
      display: flex;
    }
    iframe {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="schedule-container">
    <!-- Paste your Shift Schedule Apps Script /exec URL below -->
    <iframe src="PASTE_YOUR_SHIFT_SCHEDULE_APPS_SCRIPT_EXEC_URL_HERE"></iframe>
  </div>

</body>
</html>
