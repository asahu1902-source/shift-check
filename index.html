<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Shift Schedule & Holidays</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- App Icons -->
  <link rel="icon" type="image/png" href="calendar.png">
  <link rel="shortcut icon" type="image/png" href="calendar.png">
  <link rel="apple-touch-icon" href="calendar.png">
  <link rel="apple-touch-icon-precomposed" href="calendar.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1f0a38">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow-x: auto;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }
    .schedule-container {
      width: 100%;
      max-width: 900px;
      height: 100%;
      flex: 1;
      display: flex;
    }
    iframe {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="schedule-container">
    <iframe src="https://script.google.com/macros/s/AKfycbxn-ZKhXNgzVAks5G72XH6Lpj6S3hh5EzQzOo8ljIZwDW6cuLMSwZHnIVpjBsqn6_8bmw/exec"></iframe>
  </div>

</body>
</html>
