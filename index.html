<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Shift Schedule & Holidays</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- App Icons -->
  <link rel="icon" type="image/png" href="calendar.png">
  <link rel="apple-touch-icon" href="calendar.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1f0a38">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Direct Operator Install Header */
    #install-banner {
      display: none;
      width: 100%;
      max-width: 900px;
      background: #1f0a38;
      border-bottom: 2px solid #00f2fe;
      padding: 10px 14px;
      align-items: center;
      justify-content: space-between;
      z-index: 9999;
    }
    .install-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .install-info img {
      width: 38px;
      height: 38px;
      border-radius: 8px;
    }
    .install-text {
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
    }
    #install-btn {
      background: #00f2fe;
      color: #000000;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 900;
      cursor: pointer;
      font-size: 13px;
      text-transform: uppercase;
    }

    .schedule-container {
      width: 100%;
      max-width: 900px;
      height: 100%;
      flex: 1;
      display: flex;
    }
    iframe {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Direct Install Prompt on Screen -->
  <div id="install-banner">
    <div class="install-info">
      <img src="calendar.png" alt="Shift Check">
      <div class="install-text">Shift Schedule App</div>
    </div>
    <button id="install-btn">INSTALL APP</button>
  </div>

  <div class="schedule-container">
    <iframe src="https://script.google.com/macros/s/AKfycbxn-ZKhXNgzVAks5G72XH6Lpj6S3hh5EzQzOo8ljIZwDW6cuLMSwZHnIVpjBsqn6_8bmw/exec"></iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBanner.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    window.addEventListener('appinstalled', () => {
      installBanner.style.display = 'none';
    });
  </script>
</body>
</html>
